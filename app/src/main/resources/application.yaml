spring:
  threads:
    virtual:
      enabled: true
lab:
  greeting:
    template: "Hello, %s!"
    signed: false
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
---
spring:
  config:
    activate:
      on-profile: prod
lab:
  greeting:
    signed: true
---
spring:
  config:
    activate:
      on-profile: dev
lab:
  greeting:
    template: "[dev] Hello, %s!"
