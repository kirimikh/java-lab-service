spring:
  threads:
    virtual:
      enabled: true
lab:
  greeting:
    template: "Hello, %s!"
    signed: false
  limits:
    base-url: http://localhost:${server.port:8080}
---
spring:
  config:
    activate:
      on-profile: prod
lab:
  greeting:
    signed: true
---
spring:
  config:
    activate:
      on-profile: dev
lab:
  greeting:
    template: "[dev] Hello, %s!"
